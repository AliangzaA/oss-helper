# 只在 Actions 页手动点 Run workflow 时打 Mac 包，避免每次推代码都扣 macOS 分钟
name: build-mac

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 不签名。install.js 会把 darwin-arm64 的 Electron 装进 electronDist 指向的目录
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: oss-helper-mac
          path: |
            out/*.dmg
            out/*.zip
          if-no-files-found: error
