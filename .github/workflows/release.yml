# GitHub Actions 自动化构建工作流：自动打包 Windows (.exe) 与 macOS (.dmg) 并发布 Release
name: Release App

on:
  # 当推送带有版本号的 tag 时（例如 v1.0.0）触发自动打包并发布
  push:
    tags:
      - 'v*'
  # 支持在 GitHub 网页端的 Actions 页面手动点击按钮触发测试构建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # 同时在 Windows 和 macOS 两台云端独立机器上并发打包
        include:
          - os: windows-latest
            build_script: npm run build:win
            artifact_name: win
          - os: macos-latest
            build_script: npm run build:mac
            artifact_name: mac

    runs-on: ${{ matrix.os }}

    steps:
      # 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装 Node.js 运行环境
      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 安装项目依赖（使用 ci 确保与 package-lock 一致）
      - name: 安装项目依赖
        run: npm ci

      # 构建并打包安装包
      - name: 编译并打包应用
        run: ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 避免 macOS 因无本地证书报错

      # 归档安装包，无论是否发 Release 均可在 Actions 详情页下载测试产物
      - name: 上传安装包产物至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-helper-${{ matrix.artifact_name }}
          path: |
            out/*.exe
            out/*.dmg
            out/*.zip
          if-no-files-found: warn

      # 仅在推送 tag 时自动创建/挂载至 GitHub Releases
      - name: 发布安装包至 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/*.dmg
            out/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
